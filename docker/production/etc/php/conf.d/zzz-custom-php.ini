error_reporting = E_ERROR
error_log = /var/www/html/storage/logs/php-error.log
log_errors = Off
log_errors_max_len = 8192
ignore_repeated_errors = On
ignore_repeated_source = On

upload_max_filesize = 256M
post_max_size = 256M
memory_limit = ${PHP_MEMORY_LIMIT:-512M}
session.upload_progress.enabled = Off

; OPcache: compile once, serve many. Keeps the dashboard responsive with a
; small worker pool instead of raising the pool size to hide slow boots.
opcache.enable = 1
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.jit = off
opcache.jit_buffer_size = 0

; Fewer stat calls per request. src-mounted dev checkouts still see edits
; after the TTL, so this stays safe outside production too.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
