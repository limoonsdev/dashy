<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Dashy mark</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1030"/>
      <stop offset="1" stop-color="#0a0713"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#6b16ed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#plate)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#edge)" stroke-width="4" opacity="0.75"/>

  <!-- Routing trace: the network path the control plane draws between resources. -->
  <g fill="none" stroke="url(#edge)" stroke-width="6" stroke-linecap="round" opacity="0.55">
    <path d="M104 384V296h64"/>
    <path d="M408 128v88h-64"/>
  </g>
  <g fill="url(#edge)">
    <circle cx="104" cy="384" r="10"/>
    <circle cx="408" cy="128" r="10"/>
  </g>

  <!-- The D: a rounded stem and an open bowl, drawn as one continuous stroke. -->
  <g filter="url(#glow)">
    <path d="M184 128v256" fill="none" stroke="url(#glyph)" stroke-width="44" stroke-linecap="round"/>
    <path d="M206 150h44a106 106 0 0 1 0 212h-44" fill="none" stroke="url(#glyph)" stroke-width="44" stroke-linecap="round"/>
  </g>

  <!-- Status node: the instance is up. -->
  <g>
    <circle cx="330" cy="330" r="34" fill="#0a0713"/>
    <circle cx="330" cy="330" r="30" fill="none" stroke="#22d3ee" stroke-width="5"/>
    <circle cx="330" cy="330" r="11" fill="#22d3ee"/>
  </g>
</svg>
